<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="The personal website of Sridharan Lakshmanan is currently under construction.">
  <title>realsri. — Coming Soon</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101114;
      color: #f4f4f5;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(86, 93, 120, .16), transparent 58%),
        #101114;
    }
    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 48px 24px;
      text-align: center;
    }
    .content { width: min(100%, 680px); }
    .brand {
      margin: 0 0 54px;
      font-size: 1.15rem;
      font-weight: 750;
      letter-spacing: -.06em;
    }
    .brand span { color: #a5a6f6; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 13px;
      border: 1px solid #343640;
      border-radius: 999px;
      color: #c5c6d2;
      font-size: .78rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #a5a6f6;
      box-shadow: 0 0 12px rgba(165, 166, 246, .8);
    }
    h1 {
      margin: 25px 0 16px;
      font-size: clamp(2.7rem, 8vw, 5.2rem);
      line-height: 1.04;
      letter-spacing: -.065em;
    }
    h1 span { color: #a5a6f6; }
    .message {
      max-width: 490px;
      margin: 0 auto;
      color: #a6a7b2;
      font-size: clamp(1rem, 2.5vw, 1.12rem);
      line-height: 1.8;
    }
    footer {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 24px;
      padding: 25px 20px 30px;
      border-top: 1px solid #292a31;
      color: #777985;
      font-size: .9rem;
    }
    footer a {
      color: #c7c8d2;
      text-decoration: none;
      transition: color .2s ease;
    }
    footer a:hover, footer a:focus-visible { color: #a5a6f6; }
    footer a:focus-visible { outline: 2px solid #a5a6f6; outline-offset: 4px; }
    @media (max-width: 480px) {
      .brand { margin-bottom: 42px; }
      footer { gap: 18px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="content">
      <p class="brand">realsri<span>.</span></p>
      <div class="eyebrow"><span class="dot" aria-hidden="true"></span> A new website is in the works</div>
      <h1>Something is<br><span>coming soon.</span></h1>
      <p class="message">This website is currently under construction. I'm working on something new, so please check back soon.</p>
    </div>
  </main>
  <footer aria-label="Social links">
    <span>© 2026 realsri</span>
    <a href="https://github.com/realsri" target="_blank" rel="noopener noreferrer">GitHub</a>
    <a href="https://linkedin.com/in/realsri" target="_blank" rel="noopener noreferrer">LinkedIn</a>
  </footer>
</body>
</html>
